[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infravce"
version = "0.1.0"
description = "Provenance-grounded, confidence-tiered automatic CVE checker for infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "packaging>=24.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]
bench = [
    "docker",
    "python-on-whales",
]

[project.scripts]
infravce = "infravce.cli:main"
infravce-bench = "infravce.bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requires network access",
    "integration: exercises multiple modules",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ANN", "PTH", "TID"]
ignore = [
    "S101",  # asserts are fine in tests and internal invariants
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "N802"]
"bench/*" = ["S", "ANN", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["infravce"]

[[tool.mypy.overrides]]
module = ["yaml", "docker"]
ignore_missing_imports = true
